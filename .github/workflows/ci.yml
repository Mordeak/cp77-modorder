name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Windows app
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows application
        run: wails build -platform windows/amd64 -trimpath -ldflags="-s -w" -nosyncgomod

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: CP77-Mod-Order-Windows-${{ github.sha }}
          path: build/bin/CP77-modorder.exe
          if-no-files-found: error
          retention-days: 7

