name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version used for the dry-run build (for example 0.4.4)
        required: true
        default: 0.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version and asset name
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag must use vMAJOR.MINOR.PATCH format: $env:GITHUB_REF_NAME"
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $assetName = "CP77-Mod-Order-$env:GITHUB_REF_NAME.exe"
          } else {
            if ($env:DISPATCH_VERSION -notmatch '^\d+\.\d+\.\d+$') {
              throw "Dry-run version must use MAJOR.MINOR.PATCH format: $env:DISPATCH_VERSION"
            }
            $version = $env:DISPATCH_VERSION
            $assetName = "CP77-Mod-Order-v$version-dry-run.exe"
          }

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set version in wails.json
        shell: pwsh
        run: |
          $json = Get-Content wails.json -Raw | ConvertFrom-Json
          $json.info.productVersion = $env:VERSION
          $json | ConvertTo-Json -Depth 10 | Set-Content wails.json

      - name: Build Windows application
        run: wails build -platform windows/amd64 -trimpath -ldflags="-s -w" -nosyncgomod

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Package release files
        shell: pwsh
        run: |
          $source = 'build/bin/CP77-modorder.exe'
          $target = Join-Path 'build/bin' $env:ASSET_NAME
          Move-Item -LiteralPath $source -Destination $target

          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ASSET_NAME" | Set-Content -Path 'build/bin/SHA256SUMS.txt' -Encoding utf8NoBOM

      - name: Upload release dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: CP77-Mod-Order-release-${{ github.run_id }}
          path: |
            build/bin/CP77-Mod-Order-*.exe
            build/bin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: CP77-Mod-Order-release-${{ github.run_id }}
          path: release-assets

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $exe = Get-ChildItem -LiteralPath 'release-assets' -Filter '*.exe' | Select-Object -First 1
          $checksums = Get-Item -LiteralPath 'release-assets/SHA256SUMS.txt'
          if (-not $exe) {
            throw 'Release executable was not found in the downloaded artifact.'
          }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe.FullName $checksums.FullName --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $exe.FullName $checksums.FullName `
              --verify-tag `
              --generate-notes `
              --title "CP77 Mod Order $env:GITHUB_REF_NAME"
          }
